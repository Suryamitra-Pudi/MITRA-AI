<svg xmlns="http://w3.org" width="500" height="90" viewBox="0 0 500 90">
  <defs>
    <!-- Cyan/Blue Glow effect for Dark Mode -->
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Sharp High-Contrast Glow for Light Mode -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 3px;
      fill: #00f3ff; /* Vibrant Neon Cyan */
      filter: url(#glow-dark);
    }
    
    /* Automatically switches colors when GitHub theme changes */
    @media (prefers-color-scheme: light) {
      text {
        fill: #ff0055; /* Vibrant Neon Pink */
        filter: url(#glow-light);
      }
    }
  </style>

  <!-- Centered text inside the canvas -->
  <text x="50%" y="60" text-anchor="middle">COMING SOON</text>
</svg>
